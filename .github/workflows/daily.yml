name: A股宽度 每日更新与推送

on:
  schedule:
    # UTC 08:00 = 北京时间 16:00。收盘（15:00）后行情已稳定；
    # GitHub 免费版定时任务实测会延迟 20~45 分钟，留出余量，通常 16:30~16:50 完成。
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}      # 支持在网页上手动点一下立即运行

permissions:
  contents: write            # 需要把更新后的数据提交回仓库

concurrency:
  group: a-stock-breadth-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai          # 让脚本里的"今天"始终是北京日期，不受 runner 的 UTC 影响
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新数据并推送
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python cloud_job.py

      - name: 生成静态看板
        run: python export_static.py

      - name: 提交数据与页面
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新数据 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 放在最后：数据已安全提交，再判断推送是否成功，失败则标红，不再静默放过
      - name: 校验推送结果
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("data/last_run.json")
          if not p.exists():
              print("⚠️ 没有 last_run.json，无法判断推送结果"); sys.exit(0)
          d = json.loads(p.read_text(encoding="utf-8"))
          print("最近一次运行:", json.dumps(d, ensure_ascii=False))
          if d.get("skipped"):
              print("今日无需更新（非交易日或数据已是最新），按设计不推送 —— 正常")
              sys.exit(0)
          res = d.get("push_results") or []
          if not res:
              print("::error::没有任何可用的推送通道，请检查仓库 Secrets 是否配置")
              sys.exit(1)
          bad = [r for r in res if not r.get("ok")]
          if bad:
              for r in bad:
                  print(f"::error::推送失败 [{r['channel']}] {r['msg']}")
              sys.exit(1)
          print("✅ 推送成功:", "、".join(r["channel"] for r in res))
          PY
