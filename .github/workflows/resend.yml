name: 重发当日简报

# 两种触发方式：
#   1) 仓库 Actions 页面 → 左侧「重发当日简报」→ Run workflow（手机上最方便）
#   2) 改一下 .github/resend.trigger 文件并 push（给自动化脚本用）
# 用途：不重新抓行情，直接用仓库里的最新数据发一条推送，
#       用来验证推送通道、或者补发当天漏掉的那条。

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/resend.trigger"

permissions:
  contents: read

concurrency:
  group: a-stock-breadth-resend
  cancel-in-progress: false

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_URL: ${{ secrets.BARK_URL }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: 检出代码（含最新数据）
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送当日简报
        run: |
          # trigger 文件被删除时（清理动作）不要发，避免重复推送
          if [ "${{ github.event_name }}" = "push" ] && [ ! -f .github/resend.trigger ]; then
            echo "触发文件已删除，跳过发送"
            exit 0
          fi
          python push.py
