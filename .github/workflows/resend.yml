name: 重发当日简报

# 手动触发：仓库 Actions 页面 → 左侧「重发当日简报」→ Run workflow
# 用途：不重新抓行情（省时间），直接用仓库里的最新数据发一条推送，
#       用来验证推送通道、或者补发当天漏掉的那条。
# 和每日任务的区别：每日任务会先抓数据，这一步只发消息。

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: a-stock-breadth-resend
  cancel-in-progress: false

jobs:
  resend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_URL: ${{ secrets.BARK_URL }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - name: 检出代码（含最新数据）
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 发送当日简报
        run: python push.py
