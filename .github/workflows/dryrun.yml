name: 云端全链路演练（一次性）

# 只在自身文件变化时触发，避免与数据提交循环
on:
  push:
    paths:
      - ".github/workflows/dryrun.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 环境信息
        run: |
          mkdir -p ci-report
          { echo "Python: $(python -V 2>&1)"
            echo "时间(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "北京日期: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            echo "出口IP: $(curl -s -m 10 https://api.ipify.org || echo 未知)"
            echo "---"
          } > ci-report/dryrun.txt

      - name: 强制重算（真实抓取全市场）
        run: |
          set -o pipefail
          T0=$(date +%s)
          python update_daily.py --force 2>&1 | tee -a ci-report/dryrun.txt
          T1=$(date +%s)
          echo "" | tee -a ci-report/dryrun.txt
          echo ">>> 抓取+计算总耗时: $((T1-T0)) 秒" | tee -a ci-report/dryrun.txt

      - name: 数据自检
        run: |
          python - <<'PY' 2>&1 | tee -a ci-report/dryrun.txt
          import store
          conn = store.connect()
          rows = store.read_rows(conn)
          conn.close()
          print("总交易日:", len(rows))
          for r in rows[-3:]:
              print(f"  {r['date']} TRIN={r['trin_pct']:.2f}% 上涨占比={r['up_ratio']:.2f}% "
                    f"涨{r['up_cnt']}/跌{r['down_cnt']}/平{r['flat_cnt']} 总数{r['total_cnt']}")
          last = rows[-1]
          assert last["total_cnt"] > 4500, f"样本家数异常: {last['total_cnt']}"
          print("✅ 样本家数正常（>4500）")
          PY

      - name: 生成简报并推送
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          set -o pipefail
          python cloud_job.py --force 2>&1 | tee -a ci-report/dryrun.txt || true

      - name: 生成静态看板
        run: python export_static.py 2>&1 | tee -a ci-report/dryrun.txt

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git add -f ci-report/dryrun.txt
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "ci: 云端全链路演练结果"
            git push
          fi
